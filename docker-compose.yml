version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: cafemico_db
    environment:
      POSTGRES_USER: cafemico
      POSTGRES_PASSWORD: cafemico_secret
      POSTGRES_DB: cafemico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
